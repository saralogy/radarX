<h1>Emergency shelter</h1>
<p>A shelter must block wind and insulate you from the ground. A debris hut built from branches and leaves retains body heat without a fire.</p><h2>Site selection</h2><p>Avoid dry river beds and dead standing trees. Build close to water but above the flood line.</p>
