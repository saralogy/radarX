<h1>Burn treatment</h1>
<p>Cool a burn under cool running water for twenty minutes. Do not apply ice, butter or ointments to a fresh burn.</p><h2>Covering</h2><p>Cover the burn loosely with a clean, non-fluffy dressing. Seek medical help for large or deep burns.</p>
