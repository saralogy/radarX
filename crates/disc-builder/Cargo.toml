[package]
name = "disc-builder"
description = "Content pipeline and inspection CLI for Survival Disc bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["webp"]
# Lossy WebP transcoding of raster images (builds libwebp from source).
webp = ["dep:webp", "dep:image"]

[dependencies]
sd-zim.workspace = true
sd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
walkdir = "2"
rayon = "1"
lol_html = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
webp = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
